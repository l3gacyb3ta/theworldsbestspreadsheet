[package]
name = "wbs"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[features]
default = ["mimalloc"]
# A faster allocator (C, built with `cc`; macOS, Windows, Linux, BSD). Recalc, compiling and
# the UI allocate a lot of small values: a 21k-cell recalc is ~1.6x and a rebuild ~1.8x
# faster with it than with glibc's. `--no-default-features` builds without it.
mimalloc = ["dep:mimalloc"]

[dependencies]
wbs-core = { path = "../core" }
mimalloc = { version = "0.1", default-features = false, optional = true }
eframe = { version = "0.36", features = ["persistence"] }
serde_json = "1"
rustc-hash = "2.1"
# Native file dialogs: AppKit on macOS, xdg-desktop-portal over D-Bus on Linux (no GTK needed).
rfd = "0.17"
# The app preferences file: TOML edited in place (comments, order and unknown keys survive), in the platform config dir.
# The app preferences file: TOML edited in place (comments, order and unknown keys survive), in the platform config dir.
toml_edit = "0.25"
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
